<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teniszhírek</title>
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f5f6f3; --card: #ffffff; --text: #1d2420; --muted: #66706a; --line: #e3e6e1;
    --accent: #1f6f4a; --accent-soft: #e3f1e9; --ball: #c9dc3c; --hu: #b4442f; --en: #2f5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --card: #1b201d; --text: #e7ece8; --muted: #9aa59e; --line: #2a312d;
      --accent: #5cc48f; --accent-soft: #1f3329; --hu: #e0846f; --en: #7fa3e8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 16px 0; padding-top: max(12px, env(safe-area-inset-top)); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  #updated { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; max-width: 1100px; margin: 10px auto 0; overflow-x: auto; }
  nav button { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 8px 12px 10px; border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .list { display: grid; gap: 10px; }
  .news { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .news:hover { border-color: var(--accent); }
  .news img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
  .news h3 { font-size: 15.5px; margin: 2px 0 4px; line-height: 1.3; }
  .news p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .src { font-weight: 700; color: var(--accent); }
  .lang { font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; }
  .lang.hu { color: var(--hu); } .lang.en { color: var(--en); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .vid { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .vid:hover { border-color: var(--accent); }
  .vid img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--line); }
  .vid div { padding: 10px 12px 12px; }
  .vid h3 { font-size: 14.5px; margin: 0 0 6px; line-height: 1.3; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
  .section-title:first-child { margin-top: 0; }
  .tour { display: grid; grid-template-columns: 92px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; align-items: center; }
  .tour .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tour b { font-size: 15px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; }
  .tag.gs { background: var(--ball); color: #1d2420; }
  .note { font-size: 12px; color: var(--muted); }
  .box { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .box p { margin: 0 0 8px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 600; margin: 4px 6px 0 0; }
  .btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .fb { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .fb:hover { border-color: var(--accent); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .more { display: block; margin: 16px auto 0; }
  .ev { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ev:first-of-type { margin-top: 4px; }
  .ev b { font-size: 15px; }
  .match { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .match + .match { margin-top: 6px; }
  .match .mh { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pl { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 2px 0; }
  .pl .n { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
  .pl .n small { color: var(--muted); }
  .pl.w .n { font-weight: 700; }
  .sets { display: flex; gap: 4px; font-variant-numeric: tabular-nums; }
  .sets span { min-width: 18px; text-align: center; font-size: 14px; color: var(--muted); }
  .pl.w .sets span.won, .sets span.won { color: var(--text); font-weight: 700; }
  .sets sup { font-size: 9px; margin-left: 1px; }
  .live { background: #d33; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; }
  .live-link { color: var(--accent); font-weight: 600; font-size: 12.5px; }
  .ext { display: flex; flex-wrap: wrap; gap: 6px; }
  .ext a { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .rk { display: grid; grid-template-columns: 34px 44px 1fr auto; gap: 8px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; }
  .rk + .rk { margin-top: 4px; }
  .rk .h { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .rk .ch { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ch.up { color: #1f9d55; } .ch.down { color: #d33; } .ch.same { color: var(--muted); }
  .rk .n { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rk .n img { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; flex: none; }
  .rk .p { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tbtn { font: inherit; font-size: 12.5px; font-weight: 600; border: 1px solid var(--accent); color: var(--accent);
    background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button.tbtn { background: var(--accent); color: #fff; }
  .evlink { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-left: auto; }
  .upd { display: flex; align-items: center; gap: 6px; }
  #reload { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 999px;
    width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer; padding: 0; }
  .search { max-width: 1100px; margin: 0 auto; padding: 8px 0 10px; }
  .search input { width: 100%; font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .chips + .chips { margin-top: -6px; }
  .chip.cat.on { background: var(--text); border-color: var(--text); color: var(--bg); }
  .count { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
  select.chip { appearance: auto; max-width: 100%; }
  @media (max-width: 520px) { .news img { width: 76px; height: 60px; } .tour { grid-template-columns: 78px 1fr; } }
</style>
</head>
<body>
<header>
  <div class="top"><h1>🎾 Tenisz<span>hírek</span></h1><div class="upd"><span id="updated"></span><button id="reload" title="Frissítés" aria-label="Frissítés">↻</button></div></div>
  <nav>
    <button data-tab="hirek" class="on">Hírek</button>
    <button data-tab="videok">Videók</button>
    <button data-tab="meccsek">Meccsek</button>
    <button data-tab="ranglista">Ranglista</button>
    <button data-tab="versenyek">Versenyek</button>
    <button data-tab="facebook">Facebook</button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Keresés…" autocomplete="off" aria-label="Keresés"></div>
</header>
<main id="app"></main>

<script>
// Az adatot minden megnyitáskor frissen tölti be (nem a telefon tárolt példányát használja).
const LOADED_AT = Date.now();
function loadScripts(files, cb) {
  let left = files.length;
  files.forEach(f => {
    const s = document.createElement('script');
    s.src = f + '?t=' + LOADED_AT;
    s.onload = s.onerror = () => { if (--left === 0) cb(); };
    document.head.appendChild(s);
  });
}
document.getElementById('reload').addEventListener('click', () => location.reload());
// Ha az alkalmazás a háttérből tér vissza, és 15 percnél régebbi az adat, újratölt.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - LOADED_AT > 15 * 60000) location.reload();
});
loadScripts(['kategoriak.js', 'data.js'], start);

function start() {
  const D = window.TENISZ || { hirek: [], videok: [], versenyek: [], facebook: [] };
  const app = document.getElementById('app');
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function ago(iso) {
    const d = new Date(iso), m = Math.round((Date.now() - d) / 60000);
    if (m < 60) return Math.max(m, 1) + ' perce';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' órája';
    const n = Math.round(h / 24);
    if (n < 7) return n + ' napja';
    return d.toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' });
  }
  const fmtDay = s => new Date(s + 'T12:00:00').toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' });

  if (D.frissitve) {
    document.getElementById('updated').textContent = 'Frissítve: ' +
      new Date(D.frissitve).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  // ---- Női / férfi / páros besorolás (szabályok: kategoriak.js) ----
  const K = window.KATEGORIAK || { forras: {}, csakForras: [], noiSzavak: [], ferfiSzavak: [], parosSzavak: [],
    vegyesSzavak: [], noiNevek: [], ferfiNevek: [] };
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const L = '[\\p{L}\\p{N}]';
  const words = list => list.length ? new RegExp(`(?<!${L})(?:${list.map(reEsc).join('|')})(?!${L})`, 'iu') : /$^/;
  const names = list => list.length ? new RegExp(`(?<!${L})(?:${list.map(reEsc).join('|')})`, 'u') : /$^/;
  const R = {
    noi: words(K.noiSzavak), ferfi: words(K.ferfiSzavak), paros: words(K.parosSzavak), vegyes: words(K.vegyesSzavak),
    noiNev: names(K.noiNevek), ferfiNev: names(K.ferfiNevek),
    per: /(?<![\p{L}])\p{Lu}[\p{L}'-]+\s?\/\s?\p{Lu}[\p{L}'-]+/u
  };
  function tag(x) {
    const t = `${x.cim} ${x.kivonat || ''}`;
    const g = new Set();
    if (K.csakForras.includes(x.forras)) g.add(K.forras[x.forras]);
    else {
      if (R.noi.test(t) || R.noiNev.test(t)) g.add('noi');
      if (R.ferfi.test(t) || R.ferfiNev.test(t)) g.add('ferfi');
      if (!g.size && K.forras[x.forras]) g.add(K.forras[x.forras]);
    }
    const out = new Set();
    if (R.vegyes.test(t)) out.add('vegyes');
    else if (R.paros.test(t) || (K.perJel && R.per.test(x.cim))) {
      if (!g.size) { out.add('noi_paros'); out.add('ferfi_paros'); }
      g.forEach(v => out.add(v + '_paros'));
    } else g.forEach(v => out.add(v));
    return out;
  }
  [...D.hirek, ...D.videok].forEach(x => { x._k = tag(x); });

  // ---- Keresés (kis-/nagybetű és ékezet nélkül) ----
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const qInput = document.getElementById('q');
  let q = '';
  const hit = (...fields) => !q || q.split(/\s+/).every(w => norm(fields.join(' ')).includes(w));

  let tab = store.get('tab', 'hirek');
  let lang = store.get('lang', 'mind');
  let kat = store.get('kat', 'mind');
  let vidSrc = 'mind';
  let hirSrc = store.get('hsrc', 'mind');
  let shown = 60;

  const KATS = [['mind', 'Mind'], ['noi', 'Női'], ['ferfi', 'Férfi'], ['noi_paros', 'Női páros'],
    ['ferfi_paros', 'Férfi páros'], ['vegyes', 'Vegyes páros']];
  function katChips(pool) {
    return KATS.filter(([k]) => k === 'mind' || k === kat || pool.some(x => x._k.has(k)))
      .map(([k, l]) => `<button class="chip cat ${kat === k ? 'on' : ''}" data-kat="${k}">${l}</button>`).join('');
  }
  const katOk = x => kat === 'mind' || x._k.has(kat);
  const countLine = (n, total) => (q || n !== total) ? `<div class="count">${n} találat</div>` : '';

  function renderNews() {
    const srcs = [...new Set(D.hirek.filter(x => lang === 'mind' || x.nyelv === lang).map(x => x.forras))]
      .sort((a, b) => a.localeCompare(b));
    if (hirSrc !== 'mind' && !srcs.includes(hirSrc)) hirSrc = 'mind';
    const pool = D.hirek.filter(x => (lang === 'mind' || x.nyelv === lang) && (hirSrc === 'mind' || x.forras === hirSrc)
      && hit(x.cim, x.kivonat, x.forras));
    const items = pool.filter(katOk);
    const chips = [['mind', 'Mind'], ['hu', 'Magyar'], ['en', 'Angol']]
      .map(([k, l]) => `<button class="chip ${lang === k ? 'on' : ''}" data-lang="${k}">${l}</button>`).join('') +
      `<select class="chip" id="hsrc" aria-label="Forrás"><option value="mind">Minden forrás</option>
        ${srcs.map(s => `<option value="${esc(s)}" ${hirSrc === s ? 'selected' : ''}>${esc(s)} (${D.hirek.filter(x => x.forras === s).length})</option>`).join('')}
      </select>`;
    const list = items.slice(0, shown).map(x => `
      <a class="news" href="${esc(x.link)}" target="_blank" rel="noopener">
        ${x.kep ? `<img src="${esc(x.kep)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        <div>
          <div class="meta"><span class="src">${esc(x.forras)}</span><span class="lang ${x.nyelv}">${x.nyelv.toUpperCase()}</span><span>${ago(x.datum)}</span></div>
          <h3>${esc(x.cim)}</h3>
          ${x.kivonat ? `<p>${esc(x.kivonat)}</p>` : ''}
        </div>
      </a>`).join('');
    app.innerHTML = `<div class="chips">${chips}</div><div class="chips">${katChips(pool)}</div>
      ${countLine(items.length, D.hirek.length)}
      <div class="list">${list || '<div class="empty">Nincs találat.</div>'}</div>
      ${items.length > shown ? '<button class="chip more" data-more>Továbbiak</button>' : ''}`;
  }

  function renderVideos() {
    const sources = [...new Set(D.videok.map(v => v.forras))].sort((a, b) => a.localeCompare(b));
    const pool = D.videok.filter(v => (vidSrc === 'mind' || v.forras === vidSrc) && hit(v.cim, v.forras));
    const items = pool.filter(katOk);
    const chips = `<select class="chip" id="vsrc" aria-label="Csatorna">
        <option value="mind">Minden csatorna</option>
        ${sources.map(s => `<option value="${esc(s)}" ${vidSrc === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
      </select></div><div class="chips">${katChips(pool)}`;
    const grid = items.slice(0, shown).map(v => `
      <a class="vid" href="${esc(v.link)}" target="_blank" rel="noopener">
        <img src="${esc(v.video_id ? 'https://i.ytimg.com/vi/' + v.video_id + '/mqdefault.jpg' : v.kep)}" alt="" loading="lazy">
        <div><h3>${esc(v.cim)}</h3><div class="meta"><span class="src">${esc(v.forras)}</span><span>${ago(v.datum)}</span></div></div>
      </a>`).join('');
    app.innerHTML = `<div class="chips">${chips}</div>
      ${countLine(items.length, D.videok.length)}
      <div class="grid">${grid || '<div class="empty">Nincs találat.</div>'}</div>
      ${items.length > shown ? '<button class="chip more" data-more>Továbbiak</button>' : ''}`;
  }

  const ERED = 'https://www.eredmenyek.com/tenisz/';
  function tourButtons(t) {
    const today = new Date().toISOString().slice(0, 10);
    const started = t.kezdes <= today;
    const slugs = [['atp-egyeni', t.ea, 'férfi'], ['wta-egyeni', t.ew, 'női']].filter(([, s]) => s);
    const both = slugs.length > 1;
    let b = '';
    if (started) {
      if ((D.meccsek || []).some(m => m.vid === t.nev)) {
        b += `<button class="tbtn" data-goto-ev="${esc(t.nev)}">Eredmények</button>`;
      } else {
        b += slugs.map(([c, s, g]) => `<a class="tbtn" href="${ERED}${c}/${s}/eredmenyek/" target="_blank" rel="noopener">Eredmények${both ? ' (' + g + ')' : ''} ↗</a>`).join('');
      }
    }
    const drawSuf = /Finals/.test(t.kategoria) ? '' : 'sorsolas/';  // csoportkörös döntőknek nincs sorsolásoldala
    b += slugs.map(([c, s, g]) => `<a class="tbtn" href="${ERED}${c}/${s}/${drawSuf}" target="_blank" rel="noopener">Főtábla${both ? ' (' + g + ')' : ''} ↗</a>`).join('');
    return b ? `<div class="tbtns">${b}</div>` : '';
  }
  function tourRow(t) {
    const gs = t.kategoria === 'Grand Slam';
    return `<div class="tour">
      <div class="d">${fmtDay(t.kezdes)} –<br>${fmtDay(t.vege)}</div>
      <div><span class="tag ${gs ? 'gs' : ''}">${esc(t.kategoria)}</span><span class="tag">${esc(t.tura)}</span><br>
        <b>${esc(t.nev)}</b> <span class="note">· ${esc(t.varos)}</span>
        ${t.megjegyzes ? `<div class="note">${esc(t.megjegyzes)}</div>` : ''}
        ${tourButtons(t)}</div>
    </div>`;
  }

  function renderTournaments() {
    const today = new Date().toISOString().slice(0, 10);
    const all = D.versenyek.filter(t => hit(t.nev, t.varos, t.kategoria, t.tura));
    const now = all.filter(t => t.kezdes <= today && t.vege >= today);
    const recent = all.filter(t => t.vege < today).sort((a, b) => b.vege.localeCompare(a.vege));
    const upcoming = all.filter(t => t.kezdes > today);
    const next = upcoming.slice(0, q ? upcoming.length : shown);
    const ics = new URL('versenyek.ics', location.href).href;
    const webcal = ics.replace(/^https?:/, 'webcal:');
    const gcal = 'https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(webcal);
    const online = location.protocol.startsWith('http');
    app.innerHTML = `
      <div class="box">
        <p><b>Versenynaptár a telefonodra</b>: minden ATP- és WTA-verseny kezdete és döntős napjai, automatikusan frissül.</p>
        ${online ? `<a class="btn" href="${gcal}" target="_blank" rel="noopener">Hozzáadás a Google Naptárhoz</a>
        <a class="btn alt" href="${webcal}">Más naptáralkalmazás</a>` :
        '<p class="note">A feliratkozás gomb a weboldal közzététele után működik.</p>'}
      </div>
      <div class="section-title">Most zajlik</div>
      <div class="list">${now.map(tourRow).join('') || '<div class="note">Most nincs verseny.</div>'}</div>
      ${recent.length ? `<div class="section-title">Nemrég befejeződött</div><div class="list">${recent.map(tourRow).join('')}</div>` : ''}
      <div class="section-title">Következő versenyek</div>
      <div class="list">${next.map(tourRow).join('') || '<div class="note">Nincs találat.</div>'}</div>
      ${upcoming.length > next.length ? `<button class="chip more" data-more>Továbbiak (még ${upcoming.length - next.length})</button>` : ''}`;
  }

  // ---- Meccsek ----
  const EXT = 'https://www.eredmenyek.com/tenisz/';
  const EXT_LINKS = [
    ['ferfi', 'Challenger férfi', 'challenger-ferfi-egyeni/'], ['ferfi_paros', 'Challenger férfi páros', 'challenger-ferfi-paros/'],
    ['noi', 'WTA 125 (Challenger női)', 'challenger-noi-egyeni/'], ['noi_paros', 'WTA 125 páros', 'challenger-noi-paros/'],
    ['ferfi', 'ITF férfi', 'itf-ferfi-egyeni/'], ['ferfi_paros', 'ITF férfi páros', 'itf-ferfi-paros/'],
    ['noi', 'ITF női', 'itf-noi-egyeni/'], ['noi_paros', 'ITF női páros', 'itf-noi-paros/'],
    ['ferfi', 'Davis Kupa', 'csapatok-ferfi/'], ['noi', 'BJK Kupa', 'csapat-noi/'], ['vegyes', 'Vegyes páros', 'vegyesparos/']
  ];
  const SZINTEK = [['mind', 'Minden szint'], ['Grand Slam', 'Grand Slam'], ['Finals', 'Finals'], ['1000', '1000'],
    ['500', '500'], ['250', '250'], ['125', 'WTA 125'], ['Csapat', 'Csapat']];
  let szint = store.get('szint', 'mind');
  const D_M = D.meccsek || [];
  const mKatName = { noi: 'Női egyes', ferfi: 'Férfi egyes', noi_paros: 'Női páros', ferfi_paros: 'Férfi páros', vegyes: 'Vegyes páros' };
  const timeHu = iso => new Date(iso).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  function roundHu(r) {
    const s = String(r || '');
    const map = [[/^final$/i, 'Döntő'], [/semi/i, 'Elődöntő'], [/quarter/i, 'Negyeddöntő'], [/round of 16/i, 'Nyolcaddöntő'],
      [/group/i, 'Csoportkör'], [/qualif/i, 'Selejtező'], [/(\d+)\w*\s*round|round\s*(\d+)/i, null]];
    for (const [re, hu] of map) {
      const m = s.match(re);
      if (m) return hu || `${m[1] || m[2]}. forduló`;
    }
    return s;
  }
  const uniqC = s => [...new Set(String(s || '').split(/,\s*/).filter(Boolean))].join(', ');

  function matchRow(m) {
    m = Object.assign({}, m, { kor: roundHu(m.kor), j1: Object.assign({}, m.j1, { orszag: uniqC(m.j1.orszag) }),
      j2: Object.assign({}, m.j2, { orszag: uniqC(m.j2.orszag) }) });
    const p = (j, mine) => {
      const sets = m.szettek.map(s => {
        const a = mine ? s.a : s.b, b = mine ? s.b : s.a;
        const tb = (!s.r && s.tb != null && a < b) ? `<sup>${s.tb}</sup>` : '';
        return `<span class="${a > b ? 'won' : ''}">${s.r ? `[${a}]` : a}${tb}</span>`;
      }).join('');
      return `<div class="pl ${j.gyoztes ? 'w' : ''}"><div class="n">${esc(j.nev)}${j.orszag ? ` <small>${esc(j.orszag)}</small>` : ''}</div><div class="sets">${sets}</div></div>`;
    };
    const head = m.allapot === 'elo'
      ? `<span><span class="live">ÉLŐ</span> ${esc(m.kor)}</span><a class="live-link" href="${EXT}" target="_blank" rel="noopener">Élő eredmény →</a>`
      : `<span>${esc(m.kor)} · ${esc(mKatName[m.kat] || '')}</span><span>${timeHu(m.datum)}${m.megjegyzes ? ' · ' + esc(m.megjegyzes) : ''}</span>`;
    return `<div class="match"><div class="mh">${head}</div>${p(m.j1, true)}${p(m.j2, false)}</div>`;
  }

  let evFilter = '';
  function renderMatches() {
    const pool = D_M.filter(m => (!evFilter || m.vid === evFilter) && hit(m.verseny, m.j1.nev, m.j2.nev, m.kor));
    const byKat = pool.filter(m => szint === 'mind' || m.szint === szint);
    const items = byKat.filter(m => kat === 'mind' || m.kat === kat);
    const katRow = KATS.filter(([k]) => k === 'mind' || k === kat || byKat.some(m => m.kat === k))
      .map(([k, l]) => `<button class="chip cat ${kat === k ? 'on' : ''}" data-kat="${k}">${l}</button>`).join('');
    const szRow = SZINTEK.filter(([k]) => k === 'mind' || k === szint || pool.some(m => m.szint === k))
      .map(([k, l]) => `<button class="chip ${szint === k ? 'on' : ''}" data-szint="${esc(k)}">${l}</button>`).join('');
    // versenyenként csoportosítva; az élő meccsek előre kerülnek
    const groups = new Map();
    items.slice().sort((a, b) => (b.allapot === 'elo') - (a.allapot === 'elo') || b.datum.localeCompare(a.datum))
      .forEach(m => { const k = m.tura + '|' + m.verseny; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(m); });
    let n = 0, html = '';
    for (const [k, ms] of groups) {
      if (n >= shown) break;
      const m0 = ms[0];
      const cat = m0.tura === 'ATP' ? 'atp-egyeni' : 'wta-egyeni';
      const statUrl = m0.ered ? `${EXT}${cat}/${m0.ered}/eredmenyek/` : (m0.szint === '125' ? EXT + 'challenger-noi-egyeni/' : EXT);
      html += `<div class="ev"><b>${esc(m0.verseny)}</b><span class="tag">${esc(m0.tura)}</span><span class="tag ${m0.szint === 'Grand Slam' ? 'gs' : ''}">${esc(m0.szint)}</span>
        <a class="evlink" href="${statUrl}" target="_blank" rel="noopener">Statisztikák ↗</a>
        ${m0.ered ? `<a class="evlink" style="margin-left:0" href="${EXT}${cat}/${m0.ered}/${m0.szint === 'Finals' ? '' : 'sorsolas/'}" target="_blank" rel="noopener">Főtábla ↗</a>` : ''}</div>`;
      html += ms.slice(0, Math.max(shown - n, 0)).map(matchRow).join('');
      n += ms.length;
    }
    const ext = EXT_LINKS.filter(([k]) => kat === 'mind' || k === kat)
      .map(([, l, u]) => `<a href="${EXT + u}" target="_blank" rel="noopener">${l}</a>`).join('');
    const evChip = evFilter ? `<div class="chips"><button class="chip on" data-clear-ev>Verseny: ${esc(evFilter)} ✕</button></div>` : '';
    app.innerHTML = `${evChip}<div class="chips">${katRow}</div><div class="chips">${szRow}</div>
      ${html || `<div class="empty">${D_M.length ? 'Nincs találat.' : 'Az elmúlt héten nem volt ATP- vagy WTA-meccs (szezonszünet).'}</div>`}
      ${items.length > shown ? '<button class="chip more" data-more>Továbbiak</button>' : ''}
      <div class="section-title">Challenger, ITF, WTA 125 és csapatversenyek (eredmenyek.com)</div>
      <div class="ext">${ext}</div>`;
  }

  // ---- Ranglista ----
  let rtour = store.get('rtour', 'atp');
  function renderRankings() {
    const R = (D.ranglista || {})[rtour] || { lista: [] };
    const list = R.lista.filter(r => hit(r.nev, r.orszag));
    const chips = [['atp', 'ATP (férfi)'], ['wta', 'WTA (női)']]
      .map(([k, l]) => `<button class="chip ${rtour === k ? 'on' : ''}" data-rtour="${k}">${l}</button>`).join('');
    const rows = list.map(r => {
      const d = (r.elozo || r.hely) - r.hely;
      const ch = !r.elozo ? '<span class="ch up">új</span>' : d > 0 ? `<span class="ch up">▲${d}</span>` : d < 0 ? `<span class="ch down">▼${-d}</span>` : '<span class="ch same">–</span>';
      return `<div class="rk"><span class="h">${r.hely}.</span>${ch}<span class="n">${r.zaszlo ? `<img src="${esc(r.zaszlo)}" alt="" loading="lazy">` : ''}<span>${esc(r.nev)}</span></span><span class="p">${r.pont.toLocaleString('hu-HU')} p</span></div>`;
    }).join('');
    app.innerHTML = `<div class="chips">${chips}</div>
      ${R.datum ? `<div class="count">Világranglista, ${new Date(R.datum).toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' })} · a nyilak az előző heti helyezéshez képest</div>` : ''}
      ${rows || '<div class="empty">Nincs adat.</div>'}`;
  }

  function renderFacebook() {
    app.innerHTML = `
      <p class="note" style="margin-top:0">A Facebook nem engedi automatikusan begyűjteni a posztokat, ezért ezek az oldalak egy kattintással nyílnak meg.</p>
      <div class="list">${D.facebook.filter(f => hit(f.nev, f.url)).map(f => `
        <a class="fb" href="${esc(f.url)}" target="_blank" rel="noopener"><b>${esc(f.nev)}</b><span class="note">Megnyitás →</span></a>`).join('')}
      </div>`;
  }

  function render() {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    ({ hirek: renderNews, videok: renderVideos, meccsek: renderMatches, ranglista: renderRankings,
       versenyek: renderTournaments, facebook: renderFacebook }[tab] || renderNews)();
  }

  document.querySelector('nav').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.tab; shown = 60; evFilter = ''; store.set('tab', tab); render(); window.scrollTo(0, 0);
  });
  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; store.set('lang', lang); shown = 60; }
    else if (b.dataset.kat) { kat = b.dataset.kat; store.set('kat', kat); shown = 60; }
    else if (b.dataset.szint) { szint = b.dataset.szint; store.set('szint', szint); shown = 60; }
    else if (b.dataset.rtour) { rtour = b.dataset.rtour; store.set('rtour', rtour); }
    else if (b.dataset.gotoEv) {
      evFilter = b.dataset.gotoEv; tab = 'meccsek'; kat = 'mind'; szint = 'mind'; shown = 60;
      qInput.value = ''; q = ''; store.set('tab', tab); window.scrollTo(0, 0);
    }
    else if (b.hasAttribute('data-clear-ev')) { evFilter = ''; }
    else if (b.hasAttribute('data-more')) { shown += 60; }
    render();
  });
  app.addEventListener('change', e => {
    if (e.target.id === 'vsrc') { vidSrc = e.target.value; shown = 60; render(); }
    if (e.target.id === 'hsrc') { hirSrc = e.target.value; store.set('hsrc', hirSrc); shown = 60; render(); }
  });
  let qTimer;
  qInput.addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { q = norm(qInput.value.trim()); shown = 60; render(); }, 150);
  });
  render();
}
</script>
</body>
</html>
